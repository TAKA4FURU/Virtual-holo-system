<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ジャイロ連動 ホロ サンプル BIG_cat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #000; color: #eee;
    font-family: -apple-system, "Hiragino Sans", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }

  #card { position: fixed; inset: 0; overflow: hidden; background: var(--bg, #1c1c22); transition: background .3s; }

  /* 各レイヤー：素材画像(2154x2154)と同じ大きさの箱。動かすのは transform だけ */
  .layer { position: absolute; will-change: transform; pointer-events: none; }
  .layer > img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mask { position: absolute; inset: 0; overflow: hidden;
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
  .fill { position: absolute; will-change: transform; }

  /* HDR の走る光：重ね合わせ(blend)を使わず、いちばん上に置く */
  .glint img { position: absolute; opacity: 0; will-change: opacity; dynamic-range-limit: no-limit; }

  /* UI */
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    display: flex; gap: 8px 10px; align-items: center; justify-content: center; flex-wrap: wrap;
    background: linear-gradient(transparent, rgba(0,0,0,.7)); font-size: 13px; z-index: 5; }
  #ui button { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; padding: 8px 13px; font-size: 13px; }
  #ui label { white-space: nowrap; }
  #ui input[type=range] { width: 110px; vertical-align: middle; }
  #ui .pnum { width: 3em; background: #2a2a33; color: #fff; border: 1px solid rgba(255,255,255,.2); border-radius: 6px;
    padding: 3px 4px; font-size: 16px; text-align: right; vertical-align: middle; }
  #ui .pnum::-webkit-inner-spin-button { -webkit-appearance: none; }
  #status { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center;
    font-size: 12px; opacity: .55; z-index: 5; }

  #panel { position: fixed; left: 10px; right: 10px; bottom: calc(110px + env(safe-area-inset-bottom)); z-index: 6;
    display: none; max-height: 58vh; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
    background: rgba(10,10,16,.92); border: 1px solid rgba(255,255,255,.15); border-radius: 14px; padding: 6px 12px; font-size: 12px; }
  #panel .row { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  #panel .row:last-child { border-bottom: none; }
  #panel .head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  #panel .head b { flex: 1; font-weight: 600; }
  #panel .head input { width: 18px; height: 18px; }
  #panel select { background: #2a2a33; color: #fff; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; padding: 4px 6px; font-size: 12px; }
  #panel .sl { display: grid; grid-template-columns: 7.5em 1fr 5em; align-items: center; gap: 8px; padding: 2px 0 2px 24px; }
  #panel .nw { display: flex; align-items: center; gap: 2px; justify-content: flex-end; }
  #panel .num { width: 4.2em; background: #2a2a33; color: #fff; border: 1px solid rgba(255,255,255,.2); border-radius: 6px;
    padding: 3px 4px; font-size: 16px; text-align: right; -moz-appearance: textfield; }  /* 16px：iPhoneで入力時に画面が拡大されないように */
  #panel .num::-webkit-inner-spin-button { -webkit-appearance: none; }
  #toast { position: fixed; left: 50%; bottom: calc(40px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 7;
    background: rgba(0,0,0,.75); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px; pointer-events: none;
    opacity: 0; transition: opacity .4s; white-space: nowrap; }
  body.noui #ui, body.noui #status, body.noui #panel, body.noui #hdrTest { display: none !important; }

  #hdrTest { position: fixed; top: calc(34px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 6;
    display: none; gap: 10px; align-items: center; background: rgba(0,0,0,.85); padding: 10px 14px; border-radius: 12px; font-size: 12px; }
  #hdrTest div { width: 56px; height: 56px; border-radius: 6px; background: #fff; flex-shrink: 0; }
  #hdrTest span { white-space: nowrap; }
  #hdrTest img { width: 56px; height: 56px; border-radius: 6px; dynamic-range-limit: no-limit; }

  #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5,5,10,.82); z-index: 10; text-align: center; }
  #start button { font-size: 18px; padding: 16px 28px; border-radius: 999px; border: none; color: #111; font-weight: 700;
    background: linear-gradient(110deg, #ff7ab8, #ffe27a, #7affc4, #7ad0ff, #c47aff); }
  #start p { margin-top: 14px; font-size: 13px; opacity: .7; line-height: 1.7; }
</style>
</head>
<body>

<div id="status">傾きセンサー：未開始</div>
<div id="card"></div>
<div id="panel"></div>

<div id="ui">
  <label>強さ <input type="range" id="power" min="0" max="10" step="1" value="5"> <input type="number" id="powerNum" class="pnum" min="0" max="10" step="1" value="5"></label>
  <button id="bgBtn">背景：濃いグレー</button>
  <button id="recenter">水平リセット</button>
  <button id="panelBtn">ホロ設定</button>
  <button id="hideBtn">表示を消す</button>
</div>
<div id="toast"></div>

<div id="start">
  <div>
    <button id="startBtn">タップして開始</button>
    <p>iPhoneは「動きと画面の向き」へのアクセスを許可してください。<br>PCではマウス／ドラッグで傾きを再現します。</p>
  </div>
</div>

  const axisValue = (axis, x, y) => axis === 'x' ? x : axis === 'y' ? y : x * .82 + y * .57;

  // 色相→RGB（彩度100%・明度62%）
  function hueRGB(h) {

    const [r, g, b] = h < 1 ? [c, x, 0] : h < 2 ? [x, c, 0] : h < 3 ? [0, c, x] : h < 4 ? [0, x, c] : h < 5 ? [x, 0, c] : [c, 0, x];
    return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
  }
  // ラジアル：描画エリアの中心を軸に回る虹の円盤。1画素ずつ色を決めるので継ぎ目が出ない
  // size>1 は虹の一部だけを使い、左右対称に行って戻る並びにする
  function paintDisc(cv, D, size, offset) {
    const n = Math.ceil(D * .4);
    cv.width = cv.height = n; cv.style.width = cv.style.height = D + 'px';
    const g = cv.getContext('2d'), img = g.createImageData(n, n), d = img.data, r = n / 2;
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      let a = Math.atan2(y + .5 - r, x + .5 - r) * 180 / Math.PI; if (a < 0) a += 360;
      const fold = a <= 180 ? a : 360 - a;
      const [R, G, B] = hueRGB(size === 1 ? a + offset : offset + fold * 2 / size);
      const i = (y * n + x) * 4; d[i] = R; d[i + 1] = G; d[i + 2] = B; d[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  }
  // 縦・横：模様は長さ方向にしか変化しないので高さ1pxで描いて引き伸ばす（軽い）
  // 1画素ずつ色を決めるので、虹1周の継ぎ目に隙間（黒い線）ができない
  function paintStripes(cv, Lc, S, P, offset) {
    const res = clamp(24 / P, .25, 1), n = Math.ceil(Lc * res);
    cv.width = n; cv.height = 1;
    cv.style.width = Lc + 'px'; cv.style.height = S + 'px';
    const g = cv.getContext('2d'), img = g.createImageData(n, 1), d = img.data;
    const phase = (offset / 360) * P;
    for (let i = 0; i < n; i++) {
      const u = ((i + .5) / res + phase) / P;
      const [R, G, B] = hueRGB((u - Math.floor(u)) * 360);
      d[i * 4] = R; d[i * 4 + 1] = G; d[i * 4 + 2] = B; d[i * 4 + 3] = 255;
    }
    g.putImageData(img, 0, 0);

  // 塗りの基準は画面の中心（表示エリアの中心）。層ごとに箱の大きさが違っても、模様の位置はそろう
  function paintFill(f) {
    const cfg = f.cfg, cv = f.c, g = cfg.geo;
    f.rotOffset = cfg.pattern === 'radial' && cfg.size === 1;      // サイズ1のラジアルは開始位置を回転で表す
    const key = [cfg.pattern, cfg.size, f.rotOffset ? 0 : cfg.offset, g.w, g.h, g.cx, g.cy, portraitH()].join('|');
    if (key === f.painted) return;
    f.painted = key;
    const R = Math.hypot(Math.max(g.cx, g.w - g.cx), Math.max(g.cy, g.h - g.cy)) + 10;   // 箱の隅まで届く半径
    if (cfg.pattern === 'radial') {
      f.mode = 'spin';
      paintDisc(cv, R * 2, cfg.size, f.rotOffset ? 0 : cfg.offset);
      Object.assign(cv.style, { left: (g.cx - R) + 'px', top: (g.cy - R) + 'px', transformOrigin: '50% 50%' });
    } else {
      f.mode = 'stripe';
      f.theta = cfg.pattern === 'v' ? 0 : 90;
      const Sd = Math.ceil(R * 2), Lc = Sd + portraitH() * 3.2;
      paintStripes(cv, Lc, Sd, cfg.size * portraitH(), cfg.offset);
      Object.assign(cv.style, { left: (g.cx - Lc / 2) + 'px', top: (g.cy - Sd / 2) + 'px', transformOrigin: '50% 50%' });
    }
  }

  // ===== ぼかし：形（マスク）を一度だけぼかして作り直す。毎コマのぼかし処理はしない =====

  // ===== 画面サイズが変わったときだけ作り直す =====
  function rebuild() {

      const left = W / 2 + (r.x - SRC / 2) * box.k, top = H / 2 + (r.y - SRC / 2) * box.k;
      c.geo = { w: r.w * box.k, h: r.h * box.k, cx: W / 2 - left, cy: H / 2 - top };
      Object.assign(c.el.style, { left: left + 'px', top: top + 'px', width: c.geo.w + 'px', height: c.geo.h + 'px' });
      if (c.fill) paintFill(c.fill);
      if (c.kind === 'line') for (const g of c.bands) Object.assign(g.im.style, {
        left: g.b.x * box.k + 'px', top: g.b.y * box.k + 'px', width: g.b.w * box.k + 'px', height: g.b.h * box.k + 'px' });
      if (c.far) applyBlur(k);
    }
    applyLooks(); applyOrder();
  }
  // 見た目の設定（表示・不透明度・色）を反映
  function applyLooks() {
    for (const k of ORDER) {
      const c = L[k];
      c.el.style.display = c.visible ? '' : 'none';
      if (c.opacity != null) c.el.style.opacity = c.opacity / 100;
      if (c.kind === 'base') { const g = Math.round(c.gray / 100 * 255); c.maskEl.style.background = `rgb(${g},${g},${g})`; }
    }
  }

  // ===== 傾きの入力 =====
  let target = { x: 0, y: 0 }, neutral = null, lastRaw = null, lastVal = null, lastEvtT = 0, vel = { x: 0, y: 0 }, gyroActive = false;
  const screenAngle = () => (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0);
  function onOrient(e) {
    if (e.beta == null || e.gamma == null) return;
    let x, y; const a = screenAngle();
    if (a === 90) { x = e.beta; y = -e.gamma; } else if (a === -90 || a === 270) { x = -e.beta; y = e.gamma; } else { x = e.gamma; y = e.beta; }
    const now = performance.now() / 1000;
    lastRaw = { x, y }; if (!neutral) neutral = { x, y };
    const v = { x: (x - neutral.x) / MAX_TILT, y: (y - neutral.y) / MAX_TILT };
    if (lastVal) {
      const dt = now - lastEvtT;
      if (dt > 0.004 && dt < 0.2) {
        vel.x = clamp(vel.x * .5 + .5 * (v.x - lastVal.x) / dt, -12, 12);
        vel.y = clamp(vel.y * .5 + .5 * (v.y - lastVal.y) / dt, -12, 12);
      }
    }
    lastVal = v; lastEvtT = now;
    if (!gyroActive) { gyroActive = true; status.textContent = '傾きセンサー：動作中'; }
  }
  async function start() {
    $('start').style.display = 'none';
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== 'granted') { status.textContent = '傾きセンサー：許可されませんでした（ドラッグで操作できます）'; return; }
      }
      window.addEventListener('deviceorientation', onOrient);
      setTimeout(() => { if (!gyroActive) status.textContent = '傾きセンサーなし：マウス／ドラッグで操作'; }, 1200);
    } catch (err) { status.textContent = 'センサー開始に失敗：' + err.message; }
  }
  $('startBtn').addEventListener('click', start);
  $('recenter').addEventListener('click', () => { if (lastRaw) neutral = { ...lastRaw }; lastVal = null; vel = { x: 0, y: 0 }; target = { x: 0, y: 0 }; });
  function onPointer(e) {
    if (gyroActive) return;
    if (e.target.closest && e.target.closest('#ui, #panel, #hdrTest')) return;
    target.x = clamp((e.clientX / innerWidth - .5) * 2, -1, 1);
    target.y = clamp((e.clientY / innerHeight - .5) * 2, -1, 1);
  }
  window.addEventListener('pointermove', onPointer);
  window.addEventListener('pointerdown', onPointer);

  // ===== HDR の走る光 =====
  function updateGlint(c, tx, ty) {
    const v = c.axis === 'x' ? tx : c.axis === 'y' ? ty : tx * Math.cos(GLINT_ANG) + ty * Math.sin(GLINT_ANG);
    const shift = (((c.offset + 180) % 360) - 180) / 360 * 1.4;
    const phase = 0.5 + GLINT_SPEED * v + shift;
    for (const g of c.bands) {
      const d = (phase - g.b.c) / GLINT_WIDTH;
      const o = Math.round(Math.exp(-d * d) * 100) / 100;
      if (o !== g.last) { g.im.style.opacity = o; g.last = o; }
    }
  }

  // ===== 毎コマ：transform と不透明度を書き換えるだけ =====
  const sp = { x: 0, y: 0, vx: 0, vy: 0 }, DAMP_C = 2 * Math.sqrt(SPRING_K) * SPRING_DAMP;
  let lastT = performance.now();
  function tick(t) {
    const dt = clamp((t - lastT) / 1000, .001, 1 / 30); lastT = t;
    let tx = target.x, ty = target.y;
    if (gyroActive && lastVal) {
      const lead = Math.min(performance.now() / 1000 - lastEvtT + LEAD, .06);
      tx = clamp(lastVal.x + vel.x * lead, -1.15, 1.15); ty = clamp(lastVal.y + vel.y * lead, -1.15, 1.15);
    }
    for (let i = 0; i < 2; i++) {
      const h = dt / 2;
      sp.vx += (SPRING_K * (tx - sp.x) - DAMP_C * sp.vx) * h; sp.x += sp.vx * h;
      sp.vy += (SPRING_K * (ty - sp.y) - DAMP_C * sp.vy) * h; sp.y += sp.vy * h;
    }
    const x = sp.x * power, y = sp.y * power;
    for (const k of ORDER) {
      const c = L[k]; if (!c.visible) continue;
      const z = zOf(k);
      if (z) c.el.style.transform = `translate3d(${(-x * z * PX_PER_UNIT).toFixed(2)}px,${(-y * z * PX_PER_UNIT).toFixed(2)}px,0)`;
      if (c.fill) moveFill(c.fill, clamp(x, -1.5, 1.5), clamp(y, -1.5, 1.5));
      if (c.glint) updateGlint(c, sp.x, sp.y);
    }
    requestAnimationFrame(tick);
  }

  // ===== 設定パネル =====
  // スライダーの右に数値入力欄。どちらを変えても同じ値になる
  const LIMITS = { offset: [0, 360, 5], size: [1, 20, 1], gray: [0, 50, 1], opacity: [0, 100, 1], blur: [0, 100, 1], dist: [0, 30, .01] };
  function slider(k, f, label, unit = '') {
    const [min, max, step] = LIMITS[f];
    return `<label class="sl"><span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${L[k][f]}" data-k="${k}" data-f="${f}">` +
      `<span class="nw"><input type="number" class="num" min="${min}" max="${max}" step="any" value="${L[k][f]}" data-k="${k}" data-f="${f}">${unit}</span></label>`;
  }
  function buildPanel() {
    const rows = [];
    for (const k of [...ORDER].reverse()) {
      const c = L[k];
      let h = `<div class="row"><div class="head"><input type="checkbox" data-k="${k}" data-f="visible"${c.visible ? ' checked' : ''}><b>${c.name}</b>`;
      if (c.axis) h += `<select data-k="${k}" data-f="axis">${[['y', '縦の傾き'], ['x', '横の傾き'], ['xy', '縦横両方']].map(([v, n]) =>
        `<option value="${v}"${c.axis === v ? ' selected' : ''}>${n}</option>`).join('')}</select>`;
      if (c.pats) h += `<select data-k="${k}" data-f="pattern">${c.pats.map(v =>
        `<option value="${v}"${c.pattern === v ? ' selected' : ''}>${PATTERN_NAMES[v]}</option>`).join('')}</select>`;
      h += `</div>`;
      if (c.kind === 'line') h += slider(k, 'offset', '光の開始位置');
      if (c.kind === 'holo') { h += slider(k, 'offset', '開始位置'); h += slider(k, 'size', 'サイズ'); }
      if (c.kind === 'base') h += slider(k, 'gray', '色（黒〜50%灰）', '%');
      if (c.opacity != null) h += slider(k, 'opacity', '不透明度', '%');
      if (c.far) h += slider(k, 'blur', 'ぼかし', '%');
      h += slider(k, 'dist', 'カメラからの距離');
      rows.push(h + '</div>');
    }
    const p = $('panel'); p.innerHTML = rows.join('');
    p.querySelectorAll('select').forEach(el => el.addEventListener('change', () => {
      const c = L[el.dataset.k]; c[el.dataset.f] = el.value; if (c.fill) paintFill(c.fill);
    }));
    p.querySelectorAll('input[type=checkbox]').forEach(el => el.addEventListener('change', () => {
      L[el.dataset.k].visible = el.checked; applyLooks();
    }));
    let repaint = null;
    const setValue = (k, f, v, from) => {
      const [min, max] = LIMITS[f], c = L[k];
      v = clamp(isNaN(v) ? c[f] : v, min, max);
      c[f] = v;
      p.querySelectorAll(`input[data-k="${k}"][data-f="${f}"]`).forEach(el => { if (el !== from) el.value = v; });
      if ((f === 'offset' || f === 'size') && c.fill) {          // 次のコマでまとめて描き直す
        if (!repaint) requestAnimationFrame(() => { paintFill(repaint); repaint = null; });
        repaint = c.fill;
      }
      if (f === 'blur') applyBlur(k);
      if (f === 'opacity' || f === 'gray') applyLooks();
      if (f === 'dist') { applyOrder(); if (!v) c.el.style.transform = ''; }
    };
    p.querySelectorAll('input[type=range]').forEach(el => el.addEventListener('input', () => setValue(el.dataset.k, el.dataset.f, +el.value, el)));
    p.querySelectorAll('input.num').forEach(el => {
      el.addEventListener('change', () => { setValue(el.dataset.k, el.dataset.f, parseFloat(el.value)); el.value = L[el.dataset.k][el.dataset.f]; });
      el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); });
    });
  }
  $('panelBtn').addEventListener('click', () => { const p = $('panel'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; });
  // 設定ウインドウの外をタップ／クリックしたら閉じる
  document.addEventListener('pointerdown', e => {
    const p = $('panel');
    if (p.style.display === 'block' && !e.target.closest('#panel, #panelBtn')) p.style.display = 'none';
  }, true);

  // 表示を消す：画像以外を全部消す。ダブルタップ（PCはダブルクリック）で元に戻す
  let toastTimer;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.opacity = 0, 2200); }
  $('hideBtn').addEventListener('click', () => { document.body.classList.add('noui'); toast('ダブルタップで表示が戻ります'); });
  function showUI() { if (document.body.classList.contains('noui')) { document.body.classList.remove('noui'); $('toast').style.opacity = 0; } }
  let lastTap = { t: 0, x: 0, y: 0 };
  document.addEventListener('pointerdown', e => {
    if (!document.body.classList.contains('noui')) return;
    const now = performance.now();
    if (now - lastTap.t < 350 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) { showUI(); lastTap.t = 0; return; }
    lastTap = { t: now, x: e.clientX, y: e.clientY };
  });
  function setPower(v) {
    v = Math.round(clamp(isNaN(v) ? 5 : v, 0, 10));
    powerEl.value = v; $('powerNum').value = v; power = v / 10 * POWER_MAX;
  }
  powerEl.addEventListener('input', () => setPower(+powerEl.value));
  $('powerNum').addEventListener('change', e => setPower(parseFloat(e.target.value)));
  $('powerNum').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

  const BGS = [['濃いグレー', '#1c1c22'], ['ブラック', '#000']];
  let bgi = 0;
  $('bgBtn').addEventListener('click', e => {
    bgi = (bgi + 1) % BGS.length; card.style.setProperty('--bg', BGS[bgi][1]);
    e.currentTarget.textContent = '背景：' + BGS[bgi][0];
  });

  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(rebuild, 150); });
  buildPanel();
  rebuild();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
