<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ジャイロ連動 全画面ホロ デモ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #000; color: #eee;
    font-family: -apple-system, "Hiragino Sans", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }

  #card { position: fixed; inset: 0; overflow: hidden; background: var(--bg, #1c1c22); transition: background .3s; }

  /* 各レイヤー。動かすのは transform だけ（毎コマ描き直さない） */
  .layer { position: absolute; will-change: transform; pointer-events: none; }
  .layer > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .layer > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .vp { position: absolute; }                      /* 画面と同じ大きさの箱（中身の大きさを固定する） */
  .vp > svg, .vp > img { width: 100%; height: 100%; display: block; object-fit: cover; }

  /* 後光：放射状の形（マスク）は固定、中の虹色だけを回す */
  .mask { position: absolute; inset: 0; overflow: hidden; }
  .spin { position: absolute; will-change: transform; }

  /* 全体にかぶせる虹色の光沢とテカリ */
  #sheen, #glare { position: absolute; inset: 0; pointer-events: none; overflow: hidden; mix-blend-mode: overlay; }
  #sheen canvas, #glare canvas { position: absolute; will-change: transform; }
  #sheen .stripes { position: absolute; inset: 0;
    background: repeating-linear-gradient(60deg, rgba(255,255,255,0) 0 6px, rgba(255,255,255,.14) 6px 7px); }

  /* HDR のキラリ。重ね合わせ（blend）を使わず、いちばん上に置く＝白より明るい表示を保つ */
  #glint { position: absolute; pointer-events: none; }
  #glint img { position: absolute; opacity: 0; will-change: opacity; dynamic-range-limit: no-limit; }
  #hdrTest { position: fixed; top: calc(34px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 6;
    display: none; gap: 10px; align-items: center; background: rgba(0,0,0,.85); padding: 10px 14px; border-radius: 12px; font-size: 12px; }
  #hdrTest div { width: 56px; height: 56px; border-radius: 6px; flex-shrink: 0; }
  #hdrTest span { white-space: nowrap; }
  #hdrTest img { width: 56px; height: 56px; border-radius: 6px; dynamic-range-limit: no-limit; }

  /* ホロ設定パネル */
  #holoPanel { position: fixed; left: 10px; right: 10px; bottom: calc(150px + env(safe-area-inset-bottom)); z-index: 6;
    display: none; max-height: 52vh; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; background: rgba(10,10,16,.9); border: 1px solid rgba(255,255,255,.15); border-radius: 14px; padding: 10px 12px; font-size: 12px; }
  #holoPanel .row { display: grid; grid-template-columns: 7.5em 1fr 1fr; gap: 6px 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  #holoPanel .row:last-child { border-bottom: none; }
  #holoPanel b { font-weight: 600; }
  #holoPanel .nm { display: flex; align-items: center; gap: 5px; }
  #holoPanel .nm input { width: 18px; height: 18px; flex-shrink: 0; }
  #holoPanel select { background: #2a2a33; color: #fff; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; padding: 4px 6px; font-size: 12px; }
  #holoPanel .off { grid-column: 2 / 4; display: flex; align-items: center; gap: 8px; }
  #holoPanel .off input { flex: 1; }
  .fill { position: absolute; will-change: transform; }

  /* UI */
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    display: flex; gap: 8px 10px; align-items: center; justify-content: center; flex-wrap: wrap;
    background: linear-gradient(transparent, rgba(0,0,0,.7)); font-size: 13px; z-index: 5; }
  #ui button, #ui label.btn { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; padding: 8px 13px; font-size: 13px; }
  #ui label { white-space: nowrap; }
  #ui input[type=range] { width: 96px; vertical-align: middle; }
  #status { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center;
    font-size: 12px; opacity: .55; z-index: 5; }

  #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5,5,10,.82); z-index: 10; text-align: center; }
  #start button { font-size: 18px; padding: 16px 28px; border-radius: 999px; border: none; color: #111; font-weight: 700;
    background: linear-gradient(110deg, #ff7ab8, #ffe27a, #7affc4, #7ad0ff, #c47aff); }
  #start p { margin-top: 14px; font-size: 13px; opacity: .7; line-height: 1.7; }
</style>
</head>
<body>

<div id="status">傾きセンサー：未開始</div>

<div id="card">
  <!-- ここに奥→手前の順でレイヤーが入る -->
  <div id="sheen"><canvas class="fill"></canvas><div class="stripes"></div></div>
  <div id="glare"><canvas></canvas></div>
  <div id="glint"></div>
</div>

<div id="holoPanel"></div>

<div id="hdrTest"><div style="background:#fff"></div><span>← 通常の白 ／ HDRの白 →</span><img id="hdrPatch" alt=""></div>

<div id="ui">
  <label>強さ <input type="range" id="power" min="0" max="2.5" step="0.05" value="1.5"></label>
  <label>ホロ <input type="range" id="sheenAmt" min="0" max="1" step="0.05" value="1"></label>
  <label>奥の深さ <input type="range" id="farMul" min="0.5" max="2.5" step="0.05" value="1"></label>
  <button id="bgBtn">背景：濃いグレー</button>
  <button id="recenter">水平リセット</button>
  <label class="btn">画像を読込<input type="file" id="files" accept="image/*" multiple hidden></label>
  <button id="resetArt">初期に戻す</button>
  <button id="hdrBtn">HDR確認</button>
  <button id="holoBtn">ホロ設定</button>
</div>

<div id="start">
  <div>
    <button id="startBtn">タップして開始</button>
    <p>iPhoneは「動きと画面の向き」へのアクセスを許可してください。<br>PCではマウス／ドラッグで傾きを再現します。</p>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ===== 調整用の定数 =====
  const SHIFT = 40;          // 奥行き1.0の層が、最大の傾きで動くpx
  const MAX_TILT = 25;       // この角度(度)傾けたら最大
  const BLUR_BACK = 0.35;    // 奥の層のボケ（奥行き1あたりpx）… 少なめ
  const BLUR_FRONT = 3.0;    // 手前の層のボケ（奥行き1あたりpx）
  const SPRING_K = 260;      // バネの硬さ（大きいほど素早く追従）
  const SPRING_DAMP = 0.78;  // 減衰（1未満でわずかに行き過ぎて戻る＝吸い付く感じ）
  const LEAD = 0.02;         // センサーの遅れを先読みで補う秒数

  const card = $('card'), status = $('status'), sheenBox = $('sheen'), glareBox = $('glare');
  const powerEl = $('power'), sheenEl = $('sheenAmt'), farEl = $('farMul');
  let power = +powerEl.value, farMul = +farEl.value;

  // ===== 絵柄（オリジナル）。座標は 300x420 =====
  const ART_W = 300, ART_H = 420, SHIELD_CY = 185;
  const artSvg = inner => `<svg xmlns="${NS}" viewBox="0 0 ${ART_W} ${ART_H}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;

  let ring = '<defs><radialGradient id="rg" cx="50%" cy="50%"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".6" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>';
  ring += '<circle cx="150" cy="185" r="130" fill="url(#rg)"/><g fill="none" stroke="#fff" stroke-opacity=".95">';
  ring += '<circle cx="150" cy="185" r="112" stroke-width="2"/><circle cx="150" cy="185" r="100" stroke-width="1" stroke-dasharray="2 6"/>';
  for (let i = 0; i < 24; i++) {
    const a = i / 24 * Math.PI * 2;
    ring += `<line x1="${150 + Math.cos(a) * 104}" y1="${185 + Math.sin(a) * 104}" x2="${150 + Math.cos(a) * 110}" y2="${185 + Math.sin(a) * 110}" stroke-width="3"/>`;
  }
  ring += '</g>';

  let em = `<defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".45" stop-color="#e3a82b"/><stop offset=".55" stop-color="#8a5a0c"/><stop offset="1" stop-color="#ffe08a"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2340"/><stop offset="1" stop-color="#0a0812"/></linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#7fd8ff"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity=".6"/></filter></defs><g filter="url(#sh)">`;
  for (const side of [-1, 1]) {
    for (let i = 0; i < 7; i++) {
      const ang = (-60 + i * 17) * Math.PI / 180, len = 120 - i * 9;
      const bx = 150 + side * 40, by = 175;
      const tx = bx + side * Math.cos(ang) * len, ty = by + Math.sin(ang) * len;
      const nx = -Math.sin(ang) * 11, ny = Math.cos(ang) * 11;
      em += `<path d="M${bx},${by} Q${(bx + tx) / 2 + side * nx},${(by + ty) / 2 + ny} ${tx},${ty} Q${(bx + tx) / 2 - side * nx * .2},${(by + ty) / 2 - ny * .2} ${bx},${by + 14} Z" fill="url(#dark)" stroke="url(#gold)" stroke-width="2.2"/>`;
    }
  }
  em += '<path d="M150,95 L215,120 L208,205 Q195,255 150,282 Q105,255 92,205 L85,120 Z" fill="url(#dark)" stroke="url(#gold)" stroke-width="5"/>';
  em += '<path d="M150,110 L200,130 L195,203 Q184,243 150,265 Q116,243 105,203 L100,130 Z" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-opacity=".8"/>';
  em += '<path d="M160,125 L125,195 L150,195 L135,255 L182,170 L157,170 L175,125 Z" fill="url(#bolt)" stroke="#fff" stroke-width="2"/>';
  em += '<circle cx="150" cy="96" r="13" fill="#ff3b6b" stroke="url(#gold)" stroke-width="4"/><circle cx="146" cy="92" r="4" fill="#fff" opacity=".8"/></g>';

  // ===== 乱数（場所ごとに固定。層の大きさが変わっても配置がずれない）=====
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  // 画面中心を原点に、マス目ごとに1個ずつ置く
  function scatter(Wl, Hl, area, seed, fn) {
    const cs = Math.sqrt(area);
    const i0 = Math.floor(-Wl / 2 / cs) - 1, i1 = Math.ceil(Wl / 2 / cs);
    const j0 = Math.floor(-Hl / 2 / cs) - 1, j1 = Math.ceil(Hl / 2 / cs);
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
      const r = rng((i * 73856093) ^ (j * 19349663) ^ (seed * 83492791));
      fn((i + r()) * cs, (j + r()) * cs, r);
    }
  }

  // ===== ぼかし済みの部品（最初に一度だけ作る）=====
  const spriteCache = new Map();
  function starPath(g, x, y, s) {
    g.moveTo(x, y - s); g.quadraticCurveTo(x, y, x + s, y); g.quadraticCurveTo(x, y, x, y + s);
    g.quadraticCurveTo(x, y, x - s, y); g.quadraticCurveTo(x, y, x, y - s);
  }
  function sprite(kind, size, blur, res) {
    const key = `${kind}|${size.toFixed(1)}|${blur.toFixed(1)}|${res}`;
    if (spriteCache.has(key)) return spriteCache.get(key);
    const pad = Math.ceil(blur * 3) + 2, S = Math.ceil((size * 2 + pad * 2) * res);
    const c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d'), OFF = S * 3, cx = S / 2, s = size * res;
    g.fillStyle = '#fff';
    if (blur > 0.3) { g.shadowColor = '#fff'; g.shadowBlur = blur * 2 * res; g.shadowOffsetX = OFF; }
    g.beginPath();
    const x = blur > 0.3 ? cx - OFF : cx;
    if (kind === 'star') starPath(g, x, cx, s); else g.arc(x, cx, s, 0, Math.PI * 2);
    g.fill();
    const out = { c, size: S / res };
    spriteCache.set(key, out);
    return out;
  }
  const q = (v, step) => Math.max(step, Math.round(v / step) * step);

  // ===== 既定のレイヤー定義（奥 → 手前）=====
  const blurFor = d => d < 0 ? -d * BLUR_BACK : d * BLUR_FRONT;
  let haloCenter = { x: 0, y: 0 };   // 画面中心からの位置

  const DEFAULTS = [
    { id: 'dust', depth: -5.5, kind: 'field', res: 1, paint(g, W, H, b) {
        scatter(W, H, 900, 3, (x, y, r) => {
          const sp = sprite('dot', q(.6 + r() * 1.4, .4), b, 1);
          g.globalAlpha = .25 + r() * .5; g.drawImage(sp.c, W / 2 + x - sp.size / 2, H / 2 + y - sp.size / 2, sp.size, sp.size);
        });
      } },
    { id: 'farspark', depth: -2.8, kind: 'field', res: 1.5, paint(g, W, H, b) {
        scatter(W, H, 7000, 11, (x, y, r) => {
          const sp = sprite('star', q(2 + r() * 5, 1), b, 1.5);
          g.globalAlpha = .3 + r() * .4; g.drawImage(sp.c, W / 2 + x - sp.size / 2, H / 2 + y - sp.size / 2, sp.size, sp.size);
        });
      } },
    { id: 'ring', depth: -1.4, kind: 'holoSvg', svg: ring, holo: 'ring' },   // 形はSVG、色はホロ
    { id: 'halo', depth: -0.6, kind: 'halo', fixedDepth: true },   // 後光は主役に付いているので「奥の深さ」の影響を受けない
    { id: 'emblem', depth: 0, kind: 'svg', svg: em },
    { id: 'spark', depth: 0.9, kind: 'field', res: 1, paint(g, W, H, b) {
        scatter(W, H, 9000, 7, (x, y, r) => {
          const sp = sprite('star', q(5 + r() * 12, 2), b, 1);
          g.globalAlpha = .5 + r() * .5; g.drawImage(sp.c, W / 2 + x - sp.size / 2, H / 2 + y - sp.size / 2, sp.size, sp.size);
        });
      } },
    { id: 'bokeh', depth: 2.2, kind: 'field', res: .75, paint(g, W, H) {
        const cols = [[255,255,255],[255,229,138],[159,232,255],[255,166,216],[184,255,207]];
        scatter(W, H, 26000, 21, (x, y, r) => {
          const ex = (x - haloCenter.x) / (innerWidth * .55), ey = (y - haloCenter.y) / (innerHeight * .32);
          const rad = 18 + r() * 38, c = cols[Math.floor(r() * cols.length)];
          if (ex * ex + ey * ey < 1) return;                   // 主役の前は空ける
          const px = W / 2 + x, py = H / 2 + y;
          const gr = g.createRadialGradient(px, py, 0, px, py, rad);
          gr.addColorStop(0, `rgba(${c},.5)`); gr.addColorStop(.6, `rgba(${c},.32)`); gr.addColorStop(1, `rgba(${c},0)`);
          g.globalAlpha = 1; g.fillStyle = gr; g.beginPath(); g.arc(px, py, rad, 0, Math.PI * 2); g.fill();
        });
      } },
  ];

  let layers = [];
  const depthOf = L => (L.depth < 0 && !L.fixedDepth) ? L.depth * farMul : L.depth;

  function clearLayers() { for (const L of layers) { L.el.remove(); if (L.url) URL.revokeObjectURL(L.url); } layers = []; }

  function makeLayerEl() { const el = document.createElement('div'); el.className = 'layer'; card.insertBefore(el, sheenBox); return el; }

  function buildDefaults() {
    clearLayers();
    for (const d of DEFAULTS) {
      const L = { ...d, el: makeLayerEl() };
      if (d.kind === 'field') { L.canvas = document.createElement('canvas'); L.el.appendChild(L.canvas); }
      if (d.kind === 'svg') { L.vp = document.createElement('div'); L.vp.className = 'vp'; L.vp.innerHTML = artSvg(d.svg); L.el.appendChild(L.vp); }
      if (d.kind === 'halo') {
        // マスクは層全体に敷く（画面サイズの箱だと、動いたときに端が見えてしまう）
        L.el.innerHTML = ['thick', 'thin', 'glow'].map(n => `<div class="mask ${n}"><canvas class="fill"></canvas></div>`).join('');
      }
      if (d.kind === 'holoSvg') {
        L.el.innerHTML = '<div class="mask"><canvas class="fill"></canvas></div>';
      }
      layers.push(L);
    }
    $('resetArt').style.display = 'none';
  }

  // ===== ホロの設定（パーツごと）=====
  // visible: 表示するか
  // axis   : 'y'=縦の傾きだけ / 'x'=横の傾きだけ / 'xy'=縦横両方
  // pattern: 'v'=縦 / 'h'=横 / 'radial'=ラジアル（盾の中心を軸に回る） / 'diag'=斜め（45度の帯）
  // offset : 色の開始位置（0〜360。虹1周が360）
  // size   : 模様の大きさ 1〜100（1＝縦画面の高さで虹1周、10＝0.1周、100＝0.01周。ラジアルは盾の周り1周あたり）
  const HOLO = {
    haloThick: { name: '後光（太）',       visible: true, axis: 'x',  pattern: 'radial', offset: 0,   size: 1 },
    haloThin:  { name: '後光（細）',       visible: true, axis: 'y',  pattern: 'radial', offset: 180, size: 1 },
    haloGlow:  { name: '後光（中心の光）', visible: true, axis: 'xy', pattern: 'radial', offset: 40,  size: 1 },
    ring:      { name: '光の輪',           visible: true, axis: 'y',  pattern: 'h',      offset: 120, size: 1 },
    sheen:     { name: '全体の光沢',       visible: true, axis: 'y',  pattern: 'diag',   offset: 0,   size: 2 },
    glint:     { name: 'キラリ',           visible: true, axis: 'xy', offset: 0, noPattern: true },
  };
  const PATTERN_NAMES = { v: '縦', h: '横', radial: 'ラジアル', diag: '斜め' };
  const SPIN_DEG = 140;        // ラジアル：最大の傾きで回る角度
  const MOVE = () => portraitH();  // 縦・横・斜め：最大の傾きで模様が動く距離（縦画面の高さ1つ分）
  let holoFills = [];
  let partEls = {};            // 表示/非表示を切り替える要素
  let customArt = false;       // 自分の画像を読み込み中か

  const axisValue = (axis, x, y) => axis === 'x' ? x : axis === 'y' ? y : x * .82 + y * .57;
  const portraitH = () => Math.max(innerWidth, innerHeight);
  const hsl = h => `hsl(${((h % 360) + 360) % 360},100%,62%)`;

  // ラジアルの円盤。size=1 なら一周で虹1回。size>1 は虹の一部だけを使い、継ぎ目が出ないよう往復させる
  function paintDisc(c, D, size, offset) {
    const res = .4, n = Math.ceil(D * res);
    c.width = c.height = n; c.style.width = c.style.height = D + 'px';
    const g = c.getContext('2d'), r = n / 2;
    for (let a = 0; a < 360; a++) {
      const fold = a <= 180 ? a : 360 - a;
      const h = size === 1 ? a + offset : offset + fold * 2 / size;
      g.fillStyle = hsl(h);
      g.beginPath(); g.moveTo(r, r);
      g.arc(r, r, r * 1.5, (a - 0.6) * Math.PI / 180, (a + 1.6) * Math.PI / 180); g.closePath(); g.fill();
    }
  }

  // 縦・横・斜めの塗り。模様は長さ方向にしか変化しないので高さ1pxで描いて引き伸ばす（軽い）
  // 動かす範囲ぶん長めに描いておくので、動いても端は見えない
  function paintStripes(c, Lc, S, P, band, offset) {
    const res = clamp(16 / P, .12, .35);
    c.width = Math.ceil(Lc * res); c.height = 1;
    c.style.width = Lc + 'px'; c.style.height = S + 'px';
    const g = c.getContext('2d'); g.setTransform(res, 0, 0, 1, 0, 0); g.clearRect(0, 0, Lc, 1);
    const phase = (offset / 360) * P;                      // 開始位置
    const BAND = ['255,79,163', '255,225,79', '79,255,176', '79,195,255', '170,110,255', '255,79,163'];
    for (let x0 = -((phase % P) + P) % P - P; x0 < Lc; x0 += P) {
      const gr = g.createLinearGradient(x0, 0, x0 + P, 0);
      if (band) {
        const add = (from, to, peak) => BAND.forEach((col, i) => {
          const p = i / (BAND.length - 1), e = Math.sin(Math.PI * p);
          gr.addColorStop(from + (to - from) * p, `rgba(${col},${(peak * e * e).toFixed(3)})`);
        });
        gr.addColorStop(0, 'rgba(0,0,0,0)'); add(.12, .46, .85); add(.54, .88, .6); gr.addColorStop(1, 'rgba(0,0,0,0)');
      } else {
        for (let h = 0; h <= 360; h += 30) gr.addColorStop(h / 360, hsl(h));
      }
      g.fillStyle = gr; g.fillRect(x0, 0, P + 1, 1);
    }
  }

  // 塗りを用意する。box=入れ物の大きさ、(cx,cy)=ラジアルの中心（盾の中心）
  function setupFill(c, key, boxW, boxH, cx, cy, opt = {}) {
    const f = { c, key, boxW, boxH, cx, cy, R: opt.R };
    c.style.opacity = opt.soft ? '.6' : '';
    paintFill(f);
    holoFills.push(f);
  }
  function paintFill(f) {
    const cfg = HOLO[f.key], c = f.c;
    if (cfg.pattern === 'radial') {
      f.mode = 'spin';
      paintDisc(c, f.R * 2, cfg.size, cfg.offset);
      Object.assign(c.style, { left: (f.cx - f.R) + 'px', top: (f.cy - f.R) + 'px', transformOrigin: '50% 50%' });
    } else {
      f.mode = 'stripe';
      f.theta = cfg.pattern === 'v' ? 0 : cfg.pattern === 'h' ? 90 : -45;
      const S = Math.ceil(Math.hypot(f.boxW, f.boxH)) + 20, Lc = S + MOVE() * 3.2;
      paintStripes(c, Lc, S, cfg.size * portraitH(), cfg.pattern === 'diag', cfg.offset);
      Object.assign(c.style, { left: (f.boxW / 2 - Lc / 2) + 'px', top: (f.boxH / 2 - S / 2) + 'px', transformOrigin: '50% 50%' });
    }
  }
  function moveFill(f, x, y) {
    const v = axisValue(HOLO[f.key].axis, x, y);
    f.c.style.transform = f.mode === 'spin'
      ? `rotate(${(v * SPIN_DEG).toFixed(2)}deg)`
      : `rotate(${f.theta}deg) translate3d(${(v * MOVE()).toFixed(1)}px,0,0)`;
  }
  // 開始位置・サイズを変えたときは、そのパーツだけ描き直す（次のコマでまとめて）
  const dirty = new Set();
  function repaintSoon(k) {
    if (!dirty.size) requestAnimationFrame(() => { for (const f of holoFills) if (dirty.has(f.key)) paintFill(f); dirty.clear(); });
    dirty.add(k);
  }

  function applyVisibility() {
    for (const [k, el] of Object.entries(partEls)) el.style.display = HOLO[k].visible ? '' : 'none';
    glintBox.style.display = (!customArt && HOLO.glint.visible) ? '' : 'none';
  }

  function buildHoloPanel() {
    const p = $('holoPanel');
    p.innerHTML = Object.entries(HOLO).map(([k, c]) => `
      <div class="row">
        <label class="nm"><input type="checkbox" data-k="${k}" data-f="visible"${c.visible ? ' checked' : ''}><b>${c.name}</b></label>
        <select data-k="${k}" data-f="axis">
          <option value="y"${c.axis === 'y' ? ' selected' : ''}>縦の傾き</option>
          <option value="x"${c.axis === 'x' ? ' selected' : ''}>横の傾き</option>
          <option value="xy"${c.axis === 'xy' ? ' selected' : ''}>縦横両方</option>
        </select>
        ${c.noPattern ? '<span></span>' : `<select data-k="${k}" data-f="pattern">${['v', 'h', 'radial', 'diag'].map(v =>
          `<option value="${v}"${c.pattern === v ? ' selected' : ''}>${PATTERN_NAMES[v]}</option>`).join('')}</select>`}
        <span></span>
        <label class="off">開始位置 <input type="range" min="0" max="360" step="5" value="${c.offset}" data-k="${k}" data-f="offset"><span>${c.offset}</span></label>
        ${c.noPattern ? '' : `<span></span><label class="off">サイズ <input type="range" min="1" max="100" step="1" value="${c.size}" data-k="${k}" data-f="size"><span>${c.size}</span></label>`}
      </div>`).join('');
    p.querySelectorAll('select').forEach(el => el.addEventListener('change', () => {
      HOLO[el.dataset.k][el.dataset.f] = el.value; repaintSoon(el.dataset.k);
    }));
    p.querySelectorAll('input[type=checkbox]').forEach(el => el.addEventListener('change', () => {
      HOLO[el.dataset.k].visible = el.checked; applyVisibility();
    }));
    p.querySelectorAll('input[type=range]').forEach(el => el.addEventListener('input', () => {
      const k = el.dataset.k, f = el.dataset.f;
      HOLO[k][f] = +el.value; el.nextElementSibling.textContent = el.value;
      if (k !== 'glint') repaintSoon(k);
    }));
  }
  $('holoBtn').addEventListener('click', () => { const p = $('holoPanel'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; });

  function setMask(el, css) { el.style.webkitMaskImage = css; el.style.maskImage = css; }

  // ===== 画面サイズや設定が変わったときだけ作り直す =====
  function rebuild() {
    const W = innerWidth, H = innerHeight;
    holoFills = []; partEls = {};
    const sc = Math.min(W / ART_W, H / ART_H);
    const cyV = (H - ART_H * sc) / 2 + SHIELD_CY * sc;
    haloCenter = { x: 0, y: cyV - H / 2 };

    for (const L of layers) {
      L.ed = depthOf(L);
      const inset = Math.ceil(SHIFT * Math.abs(L.ed) * Math.max(power, .5) * 1.1 + 16);
      L.el.style.inset = `${-inset}px`;
      const Wl = W + inset * 2, Hl = H + inset * 2;
      if (L.vp) Object.assign(L.vp.style, { left: inset + 'px', top: inset + 'px', width: W + 'px', height: H + 'px' });

      const b = blurFor(L.ed);
      if (L.kind === 'field') {
        const c = L.canvas, res = L.res;
        c.width = Math.ceil(Wl * res); c.height = Math.ceil(Hl * res);
        const g = c.getContext('2d'); g.setTransform(res, 0, 0, res, 0, 0); g.clearRect(0, 0, Wl, Hl);
        L.paint(g, Wl, Hl, b);
      }
      if (L.kind === 'svg' || L.kind === 'img') {
        const t = L.vp || L.img;
        t.style.filter = b > 0.6 ? `blur(${b.toFixed(1)}px)` : 'none';  // 静的なのでかけっぱなし
      }
      if (L.kind === 'halo') {
        const R = Math.hypot(W, H) * .62;
        const [thick, thin, glow] = L.el.querySelectorAll('.mask');
        const cx = W / 2 + inset, cy = cyV + inset;
        const fade = `radial-gradient(circle at ${cx}px ${cy}px, #000 0px, #000 ${R * .18}px, rgba(0,0,0,.55) ${R * .48}px, transparent ${R}px)`;
        // 太い筋と細い筋を別々のマスクに（以前は1枚に交互に入っていた）
        setMask(thick, `${fade}, repeating-conic-gradient(from 0deg at ${cx}px ${cy}px, #000 0deg 2.2deg, transparent 2.2deg 10deg)`);
        setMask(thin,  `${fade}, repeating-conic-gradient(from 0deg at ${cx}px ${cy}px, transparent 0deg 5deg, #000 5deg 5.8deg, transparent 5.8deg 10deg)`);
        for (const m of [thick, thin]) { m.style.webkitMaskComposite = 'source-in'; m.style.maskComposite = 'intersect'; }
        setMask(glow, `radial-gradient(circle at ${cx}px ${cy}px, rgba(0,0,0,.9) 0px, rgba(0,0,0,.35) ${R * .2}px, transparent ${R * .42}px)`);
        partEls.haloThick = thick; partEls.haloThin = thin; partEls.haloGlow = glow;
        setupFill(thick.firstElementChild, 'haloThick', Wl, Hl, cx, cy, { R });
        setupFill(thin.firstElementChild,  'haloThin',  Wl, Hl, cx, cy, { R });
        setupFill(glow.firstElementChild,  'haloGlow',  Wl, Hl, cx, cy, { R });
      }
      if (L.kind === 'holoSvg') {
        const m = L.el.querySelector('.mask');
        const url = `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(artSvg(L.svg))}")`;
        setMask(m, url);
        Object.assign(m.style, { webkitMaskSize: `${W}px ${H}px`, maskSize: `${W}px ${H}px`,
          webkitMaskPosition: `${inset}px ${inset}px`, maskPosition: `${inset}px ${inset}px`,
          webkitMaskRepeat: 'no-repeat', maskRepeat: 'no-repeat' });
        const R = Math.hypot(W, H) * .62;
        partEls[L.holo] = m;
        setupFill(m.querySelector('.fill'), L.holo, Wl, Hl, W / 2 + inset, cyV + inset, { R });
      }
    }

    // 光沢：周期のある模様を周期単位で動かす＝切れ目が出ない
    partEls.sheen = sheenBox;
    setupFill(sheenBox.querySelector('canvas'), 'sheen', W, H, W / 2, cyV, { R: Math.hypot(W, H), soft: true });
    // テカリ
    {
      const c = glareBox.querySelector('canvas'), res = .25, cw = W * 2, ch = H * 2;
      c.width = Math.ceil(cw * res); c.height = Math.ceil(ch * res);
      Object.assign(c.style, { width: cw + 'px', height: ch + 'px', left: -W / 2 + 'px', top: -H / 2 + 'px' });
      const g = c.getContext('2d'); g.setTransform(res, 0, 0, res, 0, 0);
      const r0 = Math.max(W, H) * .55;
      const gr = g.createRadialGradient(cw / 2, ch / 2, 0, cw / 2, ch / 2, r0);
      gr.addColorStop(0, 'rgba(255,255,255,.85)'); gr.addColorStop(.35, 'rgba(255,255,255,.25)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(0, 0, cw, ch);
    }
    sheenBox.style.opacity = sheenEl.value;
    if (typeof placeGlint === 'function') placeGlint();
    applyVisibility();
  }

  let rbTimer;
  const rebuildSoon = () => { clearTimeout(rbTimer); rbTimer = setTimeout(rebuild, 120); };

  // ===== 傾きの入力 =====
  let target = { x: 0, y: 0 };
  let neutral = null, lastRaw = null, lastVal = null, lastEvtT = 0, vel = { x: 0, y: 0 }, gyroActive = false;

  function screenAngle() {
    return (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0);
  }
  function onOrient(e) {
    if (e.beta == null || e.gamma == null) return;
    let x, y; const a = screenAngle();
    if (a === 90) { x = e.beta; y = -e.gamma; }
    else if (a === -90 || a === 270) { x = -e.beta; y = e.gamma; }
    else { x = e.gamma; y = e.beta; }
    const now = performance.now() / 1000;
    lastRaw = { x, y };
    if (!neutral) neutral = { x, y };
    const v = { x: (x - neutral.x) / MAX_TILT, y: (y - neutral.y) / MAX_TILT };
    if (lastVal) {
      const dt = now - lastEvtT;
      if (dt > 0.004 && dt < 0.2) {                     // 傾きの速さを推定（先読み用）
        vel.x = clamp(vel.x * .5 + .5 * (v.x - lastVal.x) / dt, -12, 12);
        vel.y = clamp(vel.y * .5 + .5 * (v.y - lastVal.y) / dt, -12, 12);
      }
    }
    lastVal = v; lastEvtT = now;
    if (!gyroActive) { gyroActive = true; status.textContent = '傾きセンサー：動作中'; }
  }

  async function start() {
    $('start').style.display = 'none';
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== 'granted') { status.textContent = '傾きセンサー：許可されませんでした（ドラッグで操作できます）'; return; }
      }
      window.addEventListener('deviceorientation', onOrient);
      setTimeout(() => { if (!gyroActive) status.textContent = '傾きセンサーなし：マウス／ドラッグで操作'; }, 1200);
    } catch (err) {
      status.textContent = 'センサー開始に失敗：' + err.message + '（ドラッグで操作できます）';
    }
  }
  $('startBtn').addEventListener('click', start);
  $('recenter').addEventListener('click', () => { if (lastRaw) neutral = { ...lastRaw }; lastVal = null; vel = { x: 0, y: 0 }; target = { x: 0, y: 0 }; });

  function onPointer(e) {
    if (gyroActive) return;
    if (e.target.closest && e.target.closest('#ui, #holoPanel, #hdrTest')) return;
    target.x = clamp((e.clientX / innerWidth - .5) * 2, -1, 1);
    target.y = clamp((e.clientY / innerHeight - .5) * 2, -1, 1);
  }
  window.addEventListener('pointermove', onPointer);
  window.addEventListener('pointerdown', onPointer);

  const GLINT_ANG = 35 * Math.PI / 180;  // 光が走る向き（左上→右下）
  const GLINT_SPEED = 0.8;               // 傾きに対する光の移動量（大きいほど少し傾けただけで走る）
  const GLINT_WIDTH = 0.13;              // 光の帯の太さ
  const glintBox = $('glint');
  const glintImgs = GLINT.bands.map(b => {
    const im = new Image(); im.src = b.src; im.decoding = 'async'; im.alt = '';
    glintBox.appendChild(im); return { im, b, last: -1 };
  });
  $('hdrPatch').src = GLINT.test;
  $('hdrBtn').addEventListener('click', () => { const t = $('hdrTest'); t.style.display = t.style.display === 'flex' ? 'none' : 'flex'; });
  function placeGlint() {
    const W = innerWidth, H = innerHeight, sc = Math.min(W / ART_W, H / ART_H);
    Object.assign(glintBox.style, { left: (W - ART_W * sc) / 2 + 'px', top: (H - ART_H * sc) / 2 + 'px', width: ART_W * sc + 'px', height: ART_H * sc + 'px' });
    for (const g of glintImgs) Object.assign(g.im.style, { left: g.b.x * sc + 'px', top: g.b.y * sc + 'px', width: g.b.w * sc + 'px', height: g.b.h * sc + 'px' });
  }
  function updateGlint(tx, ty) {
    const cfg = HOLO.glint;
    const v = cfg.axis === 'x' ? tx : cfg.axis === 'y' ? ty : tx * Math.cos(GLINT_ANG) + ty * Math.sin(GLINT_ANG);
    const shift = (((cfg.offset + 180) % 360) - 180) / 360 * 1.4;     // 開始位置のズレ
    const phase = 0.5 + GLINT_SPEED * v + shift;
    for (const g of glintImgs) {
      const d = (phase - g.b.c) / GLINT_WIDTH;
      const o = Math.round(Math.exp(-d * d) * 100) / 100;
      if (o !== g.last) { g.im.style.opacity = o; g.last = o; }   // 変わったときだけ書き換える
    }
  }

  // ===== 毎コマ：transform を書き換えるだけ =====
  const sp = { x: 0, y: 0, vx: 0, vy: 0 };
  const DAMP_C = 2 * Math.sqrt(SPRING_K) * SPRING_DAMP;
  let lastT = performance.now();
  const sheenCanvas = sheenBox.querySelector('canvas'), glareCanvas = glareBox.querySelector('canvas');

  function tick(t) {
    const dt = clamp((t - lastT) / 1000, .001, 1 / 30); lastT = t;
    let tx = target.x, ty = target.y;
    if (gyroActive && lastVal) {
      const lead = Math.min(performance.now() / 1000 - lastEvtT + LEAD, .06);
      tx = clamp(lastVal.x + vel.x * lead, -1.15, 1.15);
      ty = clamp(lastVal.y + vel.y * lead, -1.15, 1.15);
    }
    for (let i = 0; i < 2; i++) {                        // バネ（2分割で安定させる）
      const h = dt / 2;
      sp.vx += (SPRING_K * (tx - sp.x) - DAMP_C * sp.vx) * h; sp.x += sp.vx * h;
      sp.vy += (SPRING_K * (ty - sp.y) - DAMP_C * sp.vy) * h; sp.y += sp.vy * h;
    }
    const x = sp.x * power, y = sp.y * power;
    for (const L of layers) {
      L.el.style.transform = `translate3d(${(x * L.ed * SHIFT).toFixed(2)}px,${(y * L.ed * SHIFT).toFixed(2)}px,0)`;
    }
    const W = innerWidth, H = innerHeight;
    const sx = clamp(x, -1.5, 1.5), sy = clamp(y, -1.5, 1.5);
    for (const f of holoFills) moveFill(f, sx, sy);
    if (!customArt && HOLO.glint.visible) updateGlint(sp.x, sp.y);
    glareCanvas.style.transform = `translate3d(${(-sx * .6 * W).toFixed(1)}px,${(-.2 * H - sy * .4 * H).toFixed(1)}px,0)`;
    requestAnimationFrame(tick);
  }

  // ===== UI =====
  powerEl.addEventListener('input', () => { power = +powerEl.value; rebuildSoon(); });
  farEl.addEventListener('input', () => { farMul = +farEl.value; rebuildSoon(); });
  sheenEl.addEventListener('input', () => { sheenBox.style.opacity = sheenEl.value; });

  const BGS = [['濃いグレー', '#1c1c22'], ['ブラック', '#000']];
  let bgi = 0;
  $('bgBtn').addEventListener('click', e => {
    bgi = (bgi + 1) % BGS.length;
    card.style.setProperty('--bg', BGS[bgi][1]);
    e.currentTarget.textContent = '背景：' + BGS[bgi][0];
  });

  // 自分の画像：ファイル名順に 奥 → 手前（例: 01_bg.png, 02_mid.png, 03_chara.png）。最後の画像にピントが合う
  $('files').addEventListener('change', e => {
    const files = [...e.target.files].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    e.target.value = '';
    if (!files.length) return;
    clearLayers();
    const n = files.length;
    files.forEach((f, i) => {
      const L = { kind: 'img', depth: n === 1 ? 0 : -4 + 4 * i / (n - 1), el: makeLayerEl(), url: URL.createObjectURL(f) };
      L.img = document.createElement('img'); L.img.src = L.url;
      if (i === 0 && n > 1) L.el.appendChild(L.img);               // いちばん奥は層いっぱいに敷く
      else { L.vp = document.createElement('div'); L.vp.className = 'vp'; L.vp.appendChild(L.img); L.el.appendChild(L.vp); }
      layers.push(L);
    });
    customArt = true;
    rebuild();
    $('resetArt').style.display = '';
    status.textContent = `${n}枚のレイヤーを読み込みました（ファイル名順に奥→手前）`;
  });
  $('resetArt').addEventListener('click', () => {
    customArt = false;
    buildDefaults(); rebuild();
    status.textContent = gyroActive ? '傾きセンサー：動作中' : '初期の絵に戻しました';
  });

  window.addEventListener('resize', rebuildSoon);
  buildHoloPanel();
  buildDefaults();
  rebuild();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
