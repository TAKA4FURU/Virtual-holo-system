  const SRC = ASSETS.src, AREA = 1080;       // 描画エリア(1080)を画面の横幅に合わせる
  const POWER = 0.75;                        // 強さ5（10＝1.5）
  const PX_PER_UNIT = 3, MAX_TILT = 25, SPRING_K = 260, SPRING_DAMP = 0.78, LEAD = 0.02, SPIN_DEG = 140;

  // 奥 → 手前
  const LAYERS = [
    { file: '09_dust',   kind: 'holo', dist: 30,   axis: 'x',  pattern: 'h',      offset: 0,   size: 1, opacity: .8 },
    { file: '08_flash',  kind: 'holo', dist: 20,   axis: 'y',  pattern: 'radial', offset: 120, size: 1, opacity: .6 },
    { file: '07_star',   kind: 'holo', dist: 10,   axis: 'x',  pattern: 'radial', offset: 240, size: 1, opacity: 1 },
    { file: '06_baseBK', kind: 'base', dist: 0.02, color: '#000', opacity: 1 },
    { file: '05_red',    kind: 'holo', dist: 0,    axis: 'xy', pattern: 'v', offset: 270, size: 2, opacity: 1 },
    { file: '04_cyan',   kind: 'holo', dist: 0,    axis: 'xy', pattern: 'h', offset: 180, size: 2, opacity: 1 },
    { file: '03_green',  kind: 'holo', dist: 0,    axis: 'xy', pattern: 'v', offset: 90,  size: 2, opacity: 1 },
    { file: '02_blue',   kind: 'holo', dist: 0,    axis: 'xy', pattern: 'h', offset: 0,   size: 2, opacity: 1 },
  ];

  const card = $('card');
  for (const c of LAYERS) {
    c.el = document.createElement('div'); c.el.className = 'layer'; c.el.style.opacity = c.opacity;
    c.el.innerHTML = '<div class="mask"></div>'; card.appendChild(c.el);
    const m = c.el.firstElementChild, u = `url("${ASSETS.img[c.file].src}")`;
    m.style.webkitMaskImage = u; m.style.maskImage = u;
    if (c.kind === 'base') m.style.background = c.color;
    else { c.cv = document.createElement('canvas'); c.cv.className = 'fill'; m.appendChild(c.cv); }
  }

  // ===== ホロの塗り（設定が固定なので、画面サイズが変わったときだけ描く）=====
  const portraitH = () => Math.max(innerWidth, innerHeight);
  function hueRGB(h) {
    h = ((h % 360) + 360) % 360 / 60;
    const l = .62, c = (1 - Math.abs(2 * l - 1)), x = c * (1 - Math.abs(h % 2 - 1)), m = l - c / 2;
    const [r, g, b] = h < 1 ? [c, x, 0] : h < 2 ? [x, c, 0] : h < 3 ? [0, c, x] : h < 4 ? [0, x, c] : h < 5 ? [x, 0, c] : [c, 0, x];
    return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
  }
  function paintDisc(cv, D) {                 // サイズ1のラジアル：一周で虹1回（開始位置は回転で表す）
    const n = Math.ceil(D * .4);
    cv.width = cv.height = n; cv.style.width = cv.style.height = D + 'px';
    const g = cv.getContext('2d'), img = g.createImageData(n, n), d = img.data, r = n / 2;
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      let a = Math.atan2(y + .5 - r, x + .5 - r) * 180 / Math.PI; if (a < 0) a += 360;
      const [R, G, B] = hueRGB(a), i = (y * n + x) * 4;
      d[i] = R; d[i + 1] = G; d[i + 2] = B; d[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  }
  // 縞の虹の位置は、調整用サンプルと同じ見た目になるよう、サンプルと同じ基準で決める
  // （サンプルでは、画面中心が模様の端から sampleLc/2 の位置にあった）
  const sampleLc = () => Math.ceil(SRC * (innerWidth / AREA) * 1.45) + portraitH() * 3.2;
  function paintStripes(cv, Lc, S, P, offset) {
    const res = clamp(24 / P, .25, 1), n = Math.ceil(Lc * res);
    cv.width = n; cv.height = 1; cv.style.width = Lc + 'px'; cv.style.height = S + 'px';
    const g = cv.getContext('2d'), img = g.createImageData(n, 1), d = img.data;
    const phase = offset / 360 * P + sampleLc() / 2 - Lc / 2;
    for (let i = 0; i < n; i++) {
      const u = ((i + .5) / res + phase) / P, [R, G, B] = hueRGB((u - Math.floor(u)) * 360);
      d[i * 4] = R; d[i * 4 + 1] = G; d[i * 4 + 2] = B; d[i * 4 + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  }
  function paintFill(c) {
    const g = c.geo, R = Math.hypot(Math.max(g.cx, g.w - g.cx), Math.max(g.cy, g.h - g.cy)) + 10;
    if (c.pattern === 'radial') {
      paintDisc(c.cv, R * 2);
      Object.assign(c.cv.style, { left: (g.cx - R) + 'px', top: (g.cy - R) + 'px', transformOrigin: '50% 50%' });
    } else {
      c.theta = c.pattern === 'v' ? 0 : 90;
      const Sd = Math.ceil(R * 2), Lc = Sd + portraitH() * 3.2;
      paintStripes(c.cv, Lc, Sd, c.size * portraitH(), c.offset);
      Object.assign(c.cv.style, { left: (g.cx - Lc / 2) + 'px', top: (g.cy - Sd / 2) + 'px', transformOrigin: '50% 50%' });
    }
  }
  function rebuild() {
    const W = innerWidth, H = innerHeight, k = W / AREA;
    for (const c of LAYERS) {
      const r = ASSETS.img[c.file];
      const left = W / 2 + (r.x - SRC / 2) * k, top = H / 2 + (r.y - SRC / 2) * k;
      c.geo = { w: r.w * k, h: r.h * k, cx: W / 2 - left, cy: H / 2 - top };
      Object.assign(c.el.style, { left: left + 'px', top: top + 'px', width: c.geo.w + 'px', height: c.geo.h + 'px' });
      if (c.cv) paintFill(c);
    }
  }

  // ===== 傾き =====
  let target = { x: 0, y: 0 }, neutral = null, lastRaw = null, lastVal = null, lastEvtT = 0, vel = { x: 0, y: 0 }, gyro = false;
  const screenAngle = () => (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0);
  function onOrient(e) {
    if (e.beta == null || e.gamma == null) return;
    let x, y; const a = screenAngle();
    if (a === 90) { x = e.beta; y = -e.gamma; } else if (a === -90 || a === 270) { x = -e.beta; y = e.gamma; } else { x = e.gamma; y = e.beta; }
    const now = performance.now() / 1000;
    lastRaw = { x, y }; if (!neutral) neutral = { x, y };
    const v = { x: (x - neutral.x) / MAX_TILT, y: (y - neutral.y) / MAX_TILT };
    if (lastVal) {
      const dt = now - lastEvtT;
      if (dt > 0.004 && dt < 0.2) {
        vel.x = clamp(vel.x * .5 + .5 * (v.x - lastVal.x) / dt, -12, 12);
        vel.y = clamp(vel.y * .5 + .5 * (v.y - lastVal.y) / dt, -12, 12);
      }
    }
    lastVal = v; lastEvtT = now; gyro = true;
  }
  $('startBtn').addEventListener('click', async () => {
    $('start').style.display = 'none';
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        if (await DeviceOrientationEvent.requestPermission() !== 'granted') return;
      }
      window.addEventListener('deviceorientation', onOrient);
    } catch (e) {}
  });
  // センサーがないPCなどはマウスで傾きを再現
  window.addEventListener('pointermove', e => {
    if (gyro) return;
    target.x = clamp((e.clientX / innerWidth - .5) * 2, -1, 1);
    target.y = clamp((e.clientY / innerHeight - .5) * 2, -1, 1);
  });
  // ダブルタップ（PCはダブルクリック）で水平リセット
  function recenter() { if (lastRaw) neutral = { ...lastRaw }; lastVal = null; vel = { x: 0, y: 0 }; target = { x: 0, y: 0 }; }
  let lastTap = { t: 0, x: 0, y: 0 };
  document.addEventListener('pointerdown', e => {
    if ($('start').style.display !== 'none') return;
    const now = performance.now();
    if (now - lastTap.t < 350 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) { recenter(); lastTap.t = 0; return; }
    lastTap = { t: now, x: e.clientX, y: e.clientY };
  });

  // ===== 毎コマ：transform を書き換えるだけ =====
  const sp = { x: 0, y: 0, vx: 0, vy: 0 }, DAMP_C = 2 * Math.sqrt(SPRING_K) * SPRING_DAMP;
  const axisValue = (axis, x, y) => axis === 'x' ? x : axis === 'y' ? y : x * .82 + y * .57;
  let lastT = performance.now();
  function tick(t) {
    const dt = clamp((t - lastT) / 1000, .001, 1 / 30); lastT = t;
    let tx = target.x, ty = target.y;
    if (gyro && lastVal) {
      const lead = Math.min(performance.now() / 1000 - lastEvtT + LEAD, .06);
      tx = clamp(lastVal.x + vel.x * lead, -1.15, 1.15); ty = clamp(lastVal.y + vel.y * lead, -1.15, 1.15);
    }
    for (let i = 0; i < 2; i++) {
      const h = dt / 2;
      sp.vx += (SPRING_K * (tx - sp.x) - DAMP_C * sp.vx) * h; sp.x += sp.vx * h;
      sp.vy += (SPRING_K * (ty - sp.y) - DAMP_C * sp.vy) * h; sp.y += sp.vy * h;
    }
    const x = sp.x * POWER, y = sp.y * POWER;
    for (const c of LAYERS) {
      if (c.dist) c.el.style.transform = `translate3d(${(-x * c.dist * PX_PER_UNIT).toFixed(2)}px,${(-y * c.dist * PX_PER_UNIT).toFixed(2)}px,0)`;
      if (!c.cv) continue;
      const v = clamp(axisValue(c.axis, x, y), -1.55, 1.55);
      c.cv.style.transform = c.pattern === 'radial'
        ? `rotate(${(v * SPIN_DEG - c.offset).toFixed(2)}deg)`
        : `rotate(${c.theta}deg) translate3d(${(v * portraitH()).toFixed(1)}px,0,0)`;
    }
    requestAnimationFrame(tick);
  }

  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(rebuild, 150); });
  rebuild();
  requestAnimationFrame(tick);
})();
</script>
